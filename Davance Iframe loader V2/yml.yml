# ========== Ultra Custom IFRAME Loader Configuration ==========
# This YAML file defines all available presets and configurations
# Load this in your app or use as reference for API integrations

app:
  name: "Ultra Custom IFRAME Loader"
  version: "2.0.0"
  description: "Advanced iframe loader with tracking, encryption, resize & analytics"

# Preset configurations for quick loading
presets:
  default:
    site_url: "example.com"
    mode: "direct"
    utm:
      source: "iframe_loader"
      medium: "embed"
      campaign: "custom_viewer"
      term: ""
      content: ""
    api:
      key_format: "apikey"
      append_key: false
    encryption:
      enabled: false
      algorithm: "SHA-256"
    resize:
      auto_resize: true
      aspect_ratio: "16:9"
      min_height: "400px"
      max_height: "2000px"
    visual:
      width: "100%"
      height: "85vh"
      sandbox: ""
      scrolling: "auto"
      border_size: "3px"
      border_color: "#ffffff"
      zoom: 1.0
    analytics:
      endpoint: "https://httpbin.org/post"
      retry_max: 5
      backoff_base: 2000

  google:
    site_url: "google.com"
    mode: "direct"
    resize:
      aspect_ratio: "4:3"
      min_height: "500px"
      max_height: "1500px"

  youtube:
    site_url: "youtube.com"
    mode: "pathEmbed"
    resize:
      aspect_ratio: "16:9"
      min_height: "360px"
      max_height: "1080px"

  github:
    site_url: "github.com"
    mode: "pathDashboard"
    api:
      key_format: "token"
      append_key: true

# Available loading modes
modes:
  - id: "direct"
    description: "Load the site directly as entered"
  - id: "pathHome"
    path: "/home"
  - id: "pathIndex"
    path: "/index.html"
  - id: "pathEmbed"
    path: "/embed"
  - id: "queryIframe"
    query: "iframe=true"
  - id: "queryUTM"
    description: "Adds customizable UTM tracking parameters"
  - id: "pathDashboard"
    path: "/dashboard"
  - id: "pathMobile"
    path: "/mobile"
  - id: "queryEmbed"
    query: "embed=true"
  - id: "pathViewer"
    path: "/viewer"

# API key formats
api_formats:
  - apikey
  - token
  - key
  - access_token

# Sandbox options
sandbox_options:
  - value: ""
    label: "None (full permissions)"
  - value: "allow-scripts allow-same-origin"
    label: "Scripts + Same Origin"
  - value: "allow-scripts"
    label: "Scripts Only"
  - value: "allow-forms allow-scripts"
    label: "Forms + Scripts"

# Analytics event types that get tracked
event_types:
  - iframe_loaded
  - iframe_click
  - iframe_error
  - iframe_resize
  - settings_changed
  - analytics_flushed

# CORS proxy endpoints (public, free tiers)
proxies:
  primary: "https://api.allorigins.win/raw"
  fallback: "https://corsproxy.io/"
  alternative: "https://proxy.cors.sh/"